name: ccie-sp-full-dataplane

mgmt:
  network: ccie-sp-full-dataplane-mgmt
  ipv4-subnet: 10.205.255.0/24

topology:
  kinds:
    cisco_xrd_vrouter:
      image: vrnetlab/cisco_xrd-vrouter:26.2.1
      env:
        XRD_NIC_TYPE: igb
    cisco_xrd:
      image: ios-xr/xrd-control-plane:24.2.11
    cisco_iol:
      image: vrnetlab/cisco_iol:17.12.01

  nodes:
    P1:
      kind: cisco_xrd_vrouter
      mgmt-ipv4: 10.205.255.101
      startup-config: ../configs/full-dataplane/00-foundation/P1.cfg
      startup-delay: 0
    P2:
      kind: cisco_xrd_vrouter
      mgmt-ipv4: 10.205.255.102
      startup-config: ../configs/full-dataplane/00-foundation/P2.cfg
      startup-delay: 90
    P3:
