    - endpoints: ["PE5:Gi0-0-0-1", "P6:Gi0-0-0-3"]
    - endpoints: ["PE6:Gi0-0-0-0", "P5:Gi0-0-0-4"]
    - endpoints: ["PE6:Gi0-0-0-1", "P6:Gi0-0-0-4"]
    - endpoints: ["RR1:Gi0-0-0-0", "P2:Gi0-0-0-5"]
    - endpoints: ["RR1:Gi0-0-0-1", "P5:Gi0-0-0-5"]
    - endpoints: ["RR2:Gi0-0-0-0", "P3:Gi0-0-0-5"]
    - endpoints: ["RR2:Gi0-0-0-1", "P6:Gi0-0-0-5"]
    - endpoints: ["PE1:Gi0-0-0-2", "CE1:Ethernet0/1"]
    - endpoints: ["PE2:Gi0-0-0-2", "CE2:Ethernet0/1"]
    - endpoints: ["PE3:Gi0-0-0-2", "CE3:Ethernet0/1"]
    - endpoints: ["PE4:Gi0-0-0-2", "CE4:Ethernet0/1"]
    - endpoints: ["PE5:Gi0-0-0-2", "CE5:Ethernet0/1"]
    - endpoints: ["PE6:Gi0-0-0-2", "CE6:Ethernet0/1"]
    - endpoints: ["PE3:Gi0-0-0-3", "CE2:Ethernet0/2"]
    - endpoints: ["PE6:Gi0-0-0-3", "CE5:Ethernet0/2"]
