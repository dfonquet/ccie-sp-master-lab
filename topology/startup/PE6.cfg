hostname PE6
!
banner login @
************************************************************
*                                                          *
*              CCIE SERVICE PROVIDER LAB                  *
*                                                          *
*        AUTHORIZED TRAINING AND AUTOMATION ONLY           *
*                                                          *
************************************************************
@
!
interface Loopback0
 description MgM-000012 | CCIE-SP PE
 ipv4 address 10.0.0.12 255.255.255.255
 ipv6 address 2001:db8:500:abcd::12/128
 no shutdown
!
interface GigabitEthernet0/0/0/0
 description PE6--P5 pe-core L020
 ipv4 address 10.255.0.38 255.255.255.254
 ipv6 address 2001:db8:1000:120::/127
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description PE6--P6 pe-core L021
 ipv4 address 10.255.0.40 255.255.255.254
 ipv6 address 2001:db8:1000:121::/127
 no shutdown
!
interface GigabitEthernet0/0/0/2
 description PE6--CE8 customer-dual L036
 ipv4 address 10.255.0.70 255.255.255.254
 ipv6 address 2001:db8:0:24::/127
 no shutdown
!
interface GigabitEthernet0/0/0/3
 description PE6--CE9 customer L037
 ipv4 address 10.255.0.72 255.255.255.254
 ipv6 address 2001:db8:0:25::/127
 no shutdown
!
username ${CCIE_XRD_USERNAME}
 group root-lr
 group cisco-support
 secret ${CCIE_XRD_PASSWORD}
!
grpc
 port 9339
 no-tls
 address-family dual
!
line default
 transport input ssh
!
netconf-yang agent
 ssh
!
router static
 address-family ipv4 unicast
  0.0.0.0/0 MgmtEth0/RP0/CPU0/0 10.201.255.1
 !
!
ssh server v2
ssh server netconf
!
banner login @
************************************************************
*                                                          *
*              CCIE SERVICE PROVIDER LAB                  *
*                                                          *
*        AUTHORIZED TRAINING AND AUTOMATION ONLY           *
*                                                          *
************************************************************
@
!
interface Loopback0
 description MgM-000012 | CCIE-SP PE
 ipv6 address 2001:db8:500:abcd::12/128
!
interface GigabitEthernet0/0/0/0
 ipv6 address 2001:db8:1000:120::/127
!
interface GigabitEthernet0/0/0/1
 ipv6 address 2001:db8:1000:121::/127
!
router isis CORE
 is-type level-2-only
 distribute link-state
 address-family ipv4 unicast
  metric-style wide
  advertise passive-only
  mpls traffic-eng level-2-only
  mpls traffic-eng router-id Loopback0
  segment-routing mpls sr-prefer
 !
 address-family ipv6 unicast
  metric-style wide
  advertise passive-only
  single-topology
  segment-routing mpls
 !
 interface Loopback0
  passive
  address-family ipv4 unicast
   prefix-sid index 12
  !
  address-family ipv6 unicast
   prefix-sid index 612
  !
 !
 interface GigabitEthernet0/0/0/0
  circuit-type level-2-only
  no bfd fast-detect ipv4
  no bfd fast-detect ipv6
  point-to-point
  hello-padding disable
  address-family ipv4 unicast
   fast-reroute per-prefix
   metric 10
  !
  address-family ipv6 unicast
   fast-reroute per-prefix
   metric 10
  !
 !
 interface GigabitEthernet0/0/0/1
  circuit-type level-2-only
  no bfd fast-detect ipv4
  no bfd fast-detect ipv6
  point-to-point
  hello-padding disable
  address-family ipv4 unicast
   fast-reroute per-prefix
   metric 10
  !
  address-family ipv6 unicast
   fast-reroute per-prefix
   metric 10
  !
 !
!
segment-routing
 global-block 16000 23999
 traffic-eng
 !
!
end
