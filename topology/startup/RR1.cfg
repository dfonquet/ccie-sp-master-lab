hostname RR1
!
banner login @
************************************************************
*                                                          *
*              CCIE SERVICE PROVIDER LAB                  *
*                                                          *
*        AUTHORIZED TRAINING AND AUTOMATION ONLY           *
*                                                          *
************************************************************
@
!
interface Loopback0
 description MgM-000013 | CCIE-SP RR-PCE
 ipv4 address 10.0.0.13 255.255.255.255
 ipv6 address 2001:db8:500:abcd::13/128
 no shutdown
!
interface GigabitEthernet0/0/0/0
 description RR1--P3 rr-core L022
 ipv4 address 10.255.0.42 255.255.255.254
 ipv6 address 2001:db8:1000:122::/127
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description RR1--P5 rr-core L023
 ipv4 address 10.255.0.44 255.255.255.254
 ipv6 address 2001:db8:1000:123::/127
 no shutdown
!
username ${CCIE_XRD_USERNAME}
 group root-lr
 group cisco-support
 secret ${CCIE_XRD_PASSWORD}
!
grpc
 port 9339
 no-tls
 address-family dual
!
line default
 transport input ssh
!
netconf-yang agent
 ssh
!
router static
 address-family ipv4 unicast
  0.0.0.0/0 MgmtEth0/RP0/CPU0/0 10.201.255.1
 !
!
ssh server v2
ssh server netconf
!
banner login @
************************************************************
*                                                          *
*              CCIE SERVICE PROVIDER LAB                  *
*                                                          *
*        AUTHORIZED TRAINING AND AUTOMATION ONLY           *
*                                                          *
************************************************************
@
!
interface Loopback0
 description MgM-000013 | CCIE-SP RR-PCE
 ipv6 address 2001:db8:500:abcd::13/128
!
interface GigabitEthernet0/0/0/0
 ipv6 address 2001:db8:1000:122::/127
!
interface GigabitEthernet0/0/0/1
 ipv6 address 2001:db8:1000:123::/127
!
router isis CORE
 is-type level-2-only
 distribute link-state
 address-family ipv4 unicast
  metric-style wide
  advertise passive-only
  mpls traffic-eng level-2-only
  mpls traffic-eng router-id Loopback0
  segment-routing mpls sr-prefer
 !
 address-family ipv6 unicast
  metric-style wide
  advertise passive-only
  single-topology
  segment-routing mpls
 !
 interface Loopback0
  passive
  address-family ipv4 unicast
   prefix-sid index 13
  !
  address-family ipv6 unicast
   prefix-sid index 613
  !
 !
 interface GigabitEthernet0/0/0/0
  circuit-type level-2-only
  no bfd fast-detect ipv4
  no bfd fast-detect ipv6
  point-to-point
  hello-padding disable
  address-family ipv4 unicast
   fast-reroute per-prefix
   metric 10
  !
  address-family ipv6 unicast
   fast-reroute per-prefix
   metric 10
  !
 !
 interface GigabitEthernet0/0/0/1
  circuit-type level-2-only
  no bfd fast-detect ipv4
  no bfd fast-detect ipv6
  point-to-point
  hello-padding disable
  address-family ipv4 unicast
   fast-reroute per-prefix
   metric 10
  !
  address-family ipv6 unicast
   fast-reroute per-prefix
   metric 10
  !
 !
!
segment-routing
 global-block 16000 23999
 traffic-eng
 !
!
end
