************************************************************
@
!
interface Loopback0
 description MgM-000002 | CCIE-SP P
 ipv6 address 2001:db8:500:abcd::2/128
!
interface GigabitEthernet0/0/0/0
 ipv6 address 2001:db8:1000:103::/127
!
interface GigabitEthernet0/0/0/1
 ipv6 address 2001:db8:1000:105::1/127
!
