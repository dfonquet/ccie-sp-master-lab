name: ccie-sp-xrd-eight

mgmt:
  network: ccie-sp-xrd-eight-mgmt
  ipv4-subnet: 10.207.255.0/24

topology:
  kinds:
    cisco_xrd_vrouter:
      image: vrnetlab/cisco_xrd-vrouter:26.2.1
      env:
        XRD_NIC_TYPE: igb
    cisco_iol:
      image: vrnetlab/cisco_iol:17.12.01

  nodes:
    P1:
      kind: cisco_xrd_vrouter
      mgmt-ipv4: 10.207.255.101
      startup-config: ../configs/xrd-eight/00-foundation/P1.cfg
      startup-delay: 0
    P2:
      kind: cisco_xrd_vrouter
      mgmt-ipv4: 10.207.255.102
      startup-config: ../configs/xrd-eight/00-foundation/P2.cfg
      startup-delay: 120
    P3:
      kind: cisco_xrd_vrouter
      mgmt-ipv4: 10.207.255.104
      startup-config: ../configs/xrd-eight/00-foundation/P3.cfg
      startup-delay: 240
    P4:
      kind: cisco_xrd_vrouter
      mgmt-ipv4: 10.207.255.106
      startup-config: ../configs/xrd-eight/00-foundation/P4.cfg
      startup-delay: 360
    PE1:
      kind: cisco_xrd_vrouter
      mgmt-ipv4: 10.207.255.107
      startup-config: ../configs/xrd-eight/00-foundation/PE1.cfg
      startup-delay: 480
    PE2:
      kind: cisco_xrd_vrouter
      mgmt-ipv4: 10.207.255.108
      startup-config: ../configs/xrd-eight/00-foundation/PE2.cfg
      startup-delay: 600
    PE3:
      kind: cisco_xrd_vrouter
      mgmt-ipv4: 10.207.255.103
      startup-config: ../configs/xrd-eight/00-foundation/PE3.cfg
      startup-delay: 720
    RR:
      kind: cisco_xrd_vrouter
      mgmt-ipv4: 10.207.255.105
      startup-config: ../configs/xrd-eight/00-foundation/RR.cfg
      startup-delay: 840
    CE1:
      kind: cisco_iol
      mgmt-ipv4: 10.207.255.141
      startup-config: ../configs/xrd-eight/00-foundation/CE1.cfg
      startup-delay: 960
    CE2:
      kind: cisco_iol
      mgmt-ipv4: 10.207.255.143
      startup-config: ../configs/xrd-eight/00-foundation/CE2.cfg
      startup-delay: 970
    CE3:
      kind: cisco_iol
      mgmt-ipv4: 10.207.255.146
      startup-config: ../configs/xrd-eight/00-foundation/CE3.cfg
      startup-delay: 980
    AUTO1:
      kind: linux
      mgmt-ipv4: 10.207.255.150
      image: ccie-sp-automation:1.0
      cmd: sleep infinity
      env:
        AUTO1_PASSWORD: ${CCIE_AUTO_PASSWORD}
      binds:
        - ../automation/xrd-eight/workspace:/workspace/xrd-eight
        - ../automation/xrd-eight/data:/var/lib/ccie-sp
        - ../automation/xrd-eight/evidence:/evidence
        - ../automation/xrd-eight/backups:/backups

  links:
    - endpoints: ["P1:eth1", "P2:eth1"]
    - endpoints: ["P1:eth2", "P3:eth1"]
    - endpoints: ["P1:eth3", "P4:eth1"]
    - endpoints: ["P2:eth2", "P3:eth2"]
    - endpoints: ["P2:eth3", "P4:eth2"]
    - endpoints: ["P3:eth3", "P4:eth3"]
    - endpoints: ["PE1:eth1", "P1:eth4"]
    - endpoints: ["PE1:eth2", "P3:eth4"]
    - endpoints: ["PE2:eth1", "P2:eth4"]
    - endpoints: ["PE2:eth2", "P4:eth4"]
    - endpoints: ["PE3:eth1", "P1:eth5"]
    - endpoints: ["PE3:eth2", "P4:eth5"]
    - endpoints: ["RR:eth1", "P1:eth6"]
    - endpoints: ["RR:eth2", "P4:eth6"]
    - endpoints: ["CE1:eth1", "PE1:eth3"]
    - endpoints: ["CE1:eth2", "PE2:eth3"]
    - endpoints: ["CE2:eth1", "PE2:eth4"]
    - endpoints: ["CE3:eth1", "PE3:eth3"]
    - endpoints: ["CE3:eth2", "PE2:eth5"]
