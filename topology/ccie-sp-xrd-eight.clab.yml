name: ccie-sp-xrd-eight

mgmt:
  network: ccie-sp-xrd-eight-mgmt
  ipv4-subnet: 10.207.255.0/24

topology:
  kinds:
    cisco_xrd_vrouter:
      image: vrnetlab/cisco_xrd-vrouter:26.2.1
      env:
        XRD_NIC_TYPE: igb
    cisco_iol:
      image: vrnetlab/cisco_iol:17.12.01

  nodes:
    XR1:
      kind: cisco_xrd_vrouter
      mgmt-ipv4: 10.207.255.101
      startup-config: ../configs/xrd-eight/00-foundation/XR1.cfg
      startup-delay: 0
    XR2:
      kind: cisco_xrd_vrouter
      mgmt-ipv4: 10.207.255.102
      startup-config: ../configs/xrd-eight/00-foundation/XR2.cfg
      startup-delay: 120
    XR3:
      kind: cisco_xrd_vrouter
      mgmt-ipv4: 10.207.255.103
      startup-config: ../configs/xrd-eight/00-foundation/XR3.cfg
      startup-delay: 240
    XR4:
      kind: cisco_xrd_vrouter
      mgmt-ipv4: 10.207.255.108
      startup-config: ../configs/xrd-eight/00-foundation/XR4.cfg
      startup-delay: 360
    R1:
      kind: cisco_xrd_vrouter
      mgmt-ipv4: 10.207.255.104
      startup-config: ../configs/xrd-eight/00-foundation/R1.cfg
      startup-delay: 480
    R2:
      kind: cisco_xrd_vrouter
      mgmt-ipv4: 10.207.255.105
      startup-config: ../configs/xrd-eight/00-foundation/R2.cfg
      startup-delay: 600
    R3:
      kind: cisco_xrd_vrouter
      mgmt-ipv4: 10.207.255.106
      startup-config: ../configs/xrd-eight/00-foundation/R3.cfg
      startup-delay: 720
    R5:
      kind: cisco_xrd_vrouter
      mgmt-ipv4: 10.207.255.107
      startup-config: ../configs/xrd-eight/00-foundation/R5.cfg
      startup-delay: 840
    R4:
      kind: cisco_iol
      mgmt-ipv4: 10.207.255.141
      startup-config: ../configs/xrd-eight/00-foundation/R4.cfg
      startup-delay: 960
    R7:
      kind: cisco_iol
      mgmt-ipv4: 10.207.255.143
      startup-config: ../configs/xrd-eight/00-foundation/R7.cfg
      startup-delay: 970
    R10:
      kind: cisco_iol
      mgmt-ipv4: 10.207.255.146
      startup-config: ../configs/xrd-eight/00-foundation/R10.cfg
      startup-delay: 980
    AUTO1:
      kind: linux
      mgmt-ipv4: 10.207.255.150
      image: ccie-sp-automation:1.0
      cmd: sleep infinity
      env:
        AUTO1_PASSWORD: ${CCIE_AUTO_PASSWORD}
      binds:
        - ../automation/xrd-eight/workspace:/workspace/xrd-eight
        - ../automation/xrd-eight/data:/var/lib/ccie-sp
        - ../automation/xrd-eight/evidence:/evidence
        - ../automation/xrd-eight/backups:/backups

  links:
    - endpoints: ["XR1:eth1", "XR2:eth1"]
    - endpoints: ["XR1:eth2", "R1:eth1"]
    - endpoints: ["XR1:eth3", "R3:eth1"]
    - endpoints: ["XR2:eth2", "R1:eth2"]
    - endpoints: ["XR2:eth3", "R3:eth2"]
    - endpoints: ["R1:eth3", "R3:eth3"]
    - endpoints: ["R5:eth1", "XR1:eth4"]
    - endpoints: ["R5:eth2", "R1:eth4"]
    - endpoints: ["XR4:eth1", "XR2:eth4"]
    - endpoints: ["XR4:eth2", "R3:eth4"]
    - endpoints: ["XR3:eth1", "XR1:eth5"]
    - endpoints: ["XR3:eth2", "R3:eth5"]
    - endpoints: ["R2:eth1", "XR1:eth6"]
    - endpoints: ["R2:eth2", "R3:eth6"]
    - endpoints: ["R4:eth1", "R5:eth3"]
    - endpoints: ["R4:eth2", "R5:eth4"]
    - endpoints: ["R7:eth1", "XR4:eth3"]
    - endpoints: ["R7:eth2", "XR4:eth4"]
    - endpoints: ["R10:eth1", "XR3:eth3"]
    - endpoints: ["R10:eth2", "XR3:eth4"]
