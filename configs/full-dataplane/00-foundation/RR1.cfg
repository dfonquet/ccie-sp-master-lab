hostname RR1
interface Loopback0
 description FULL-DATAPLANE NODE-ID 21
 ipv4 address 10.50.0.21 255.255.255.255
 ipv6 address 2001:db8:550:abcd::21/128
!
interface GigabitEthernet0-0-0-0
 description FD019 -> P1
 ipv4 address 10.50.255.36 255.255.255.254
 ipv6 address 2001:db8:1500:13::/127
 no shutdown
!
interface GigabitEthernet0-0-0-1
 description FD020 -> P3
 ipv4 address 10.50.255.38 255.255.255.254
 ipv6 address 2001:db8:1500:14::/127
 no shutdown
!
router isis FULL-SP
 is-type level-2-only
 net 49.0050.0000.0000.0021.00
 address-family ipv4 unicast
  metric-style wide
  segment-routing mpls
 !
 address-family ipv6 unicast
  metric-style wide
  single-topology
 !
 interface Loopback0
  passive
  address-family ipv4 unicast
   prefix-sid index 21
  !
  address-family ipv6 unicast
  !
 !
 interface GigabitEthernet0-0-0-0
  point-to-point
  address-family ipv4 unicast
   metric 10
  !
  address-family ipv6 unicast
   metric 10
  !
 !
 interface GigabitEthernet0-0-0-1
  point-to-point
  address-family ipv4 unicast
   metric 10
  !
  address-family ipv6 unicast
   metric 10
  !
 !
!
segment-routing
 global-block 16000 23999
!
end
