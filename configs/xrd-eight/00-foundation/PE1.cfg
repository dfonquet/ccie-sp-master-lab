@
interface Loopback0
 description CCIE-SP PE1 NODE-ID 5
 ipv4 address 10.70.0.5 255.255.255.255
 ipv6 address 2001:db8:570:abcd::5/128
 no shutdown
!
interface GigabitEthernet0/0/0/0
 description PE1-P1 PROVIDER PE1 -> P1
 ipv4 address 10.20.0.12 255.255.255.254
 ipv6 address 2001:db8:2000:107::/127
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description PE1-P3 PROVIDER PE1 -> P3
 ipv4 address 10.20.0.14 255.255.255.254
 ipv6 address 2001:db8:2000:108::/127
 no shutdown
!
interface GigabitEthernet0/0/0/2
 description CE1-PE1 CUSTOMER PE1 -> CE1 - STUDENT SERVICE EDGE
 no shutdown
!
router isis 500-SP
 is-type level-2-only
 net 49.0001.0000.0000.0005.00
 distribute link-state
 address-family ipv4 unicast
  metric-style wide
  advertise passive-only
  mpls traffic-eng level-2-only
  mpls traffic-eng router-id Loopback0
  segment-routing mpls sr-prefer
 !
 address-family ipv6 unicast
  metric-style wide
  advertise passive-only
  single-topology
  segment-routing mpls
 !
 interface Loopback0
  passive
  address-family ipv4 unicast
   prefix-sid index 5
  !
  address-family ipv6 unicast
   prefix-sid index 605
  !
 !
 interface GigabitEthernet0/0/0/0
  circuit-type level-2-only
  bfd fast-detect ipv4
  bfd fast-detect ipv6
  point-to-point
  hello-padding disable
  address-family ipv4 unicast
   fast-reroute per-prefix
   metric 10
  !
  address-family ipv6 unicast
   fast-reroute per-prefix
   metric 10
  !
 !
 interface GigabitEthernet0/0/0/1
  circuit-type level-2-only
  bfd fast-detect ipv4
  bfd fast-detect ipv6
  point-to-point
  hello-padding disable
  address-family ipv4 unicast
   fast-reroute per-prefix
   metric 10
  !
  address-family ipv6 unicast
   fast-reroute per-prefix
   metric 10
  !
 !
!
segment-routing
 global-block 16000 23999
!
end
