interface Loopback0
 description CCIE-SP P3 NODE-ID 3
 ipv4 address 10.70.0.3 255.255.255.255
 ipv6 address 2001:db8:570:abcd::3/128
 no shutdown
!
interface GigabitEthernet0/0/0/0
 description P1-P3 PROVIDER P3 -> P1
 ipv4 address 10.20.0.3 255.255.255.254
 ipv6 address 2001:db8:2000:102::1/127
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description P2-P3 PROVIDER P3 -> P2
 ipv4 address 10.20.0.7 255.255.255.254
 ipv6 address 2001:db8:2000:104::1/127
 no shutdown
!
interface GigabitEthernet0/0/0/2
 description P3-P4 PROVIDER P3 -> P4
 ipv4 address 10.20.0.10 255.255.255.254
 ipv6 address 2001:db8:2000:106::/127
 no shutdown
!
interface GigabitEthernet0/0/0/3
 description PE1-P3 PROVIDER P3 -> PE1
 ipv4 address 10.20.0.15 255.255.255.254
 ipv6 address 2001:db8:2000:108::1/127
 no shutdown
!
router isis 500-SP
 is-type level-2-only
 net 49.0001.0000.0000.0003.00
 distribute link-state
 address-family ipv4 unicast
  metric-style wide
  advertise passive-only
  mpls traffic-eng level-2-only
  mpls traffic-eng router-id Loopback0
  segment-routing mpls sr-prefer
 !
 address-family ipv6 unicast
  metric-style wide
  advertise passive-only
  single-topology
  segment-routing mpls
 !
 interface Loopback0
  passive
  address-family ipv4 unicast
   prefix-sid index 3
  !
  address-family ipv6 unicast
   prefix-sid index 603
  !
 !
 interface GigabitEthernet0/0/0/0
  circuit-type level-2-only
  bfd fast-detect ipv4
  bfd fast-detect ipv6
  point-to-point
  hello-padding disable
  address-family ipv4 unicast
   fast-reroute per-prefix
   metric 10
  !
  address-family ipv6 unicast
   fast-reroute per-prefix
   metric 10
  !
 !
 interface GigabitEthernet0/0/0/1
  circuit-type level-2-only
  bfd fast-detect ipv4
  bfd fast-detect ipv6
  point-to-point
  hello-padding disable
  address-family ipv4 unicast
   fast-reroute per-prefix
   metric 10
  !
  address-family ipv6 unicast
   fast-reroute per-prefix
   metric 10
  !
 !
 interface GigabitEthernet0/0/0/2
  circuit-type level-2-only
  bfd fast-detect ipv4
  bfd fast-detect ipv6
  point-to-point
  hello-padding disable
  address-family ipv4 unicast
   fast-reroute per-prefix
   metric 10
  !
  address-family ipv6 unicast
   fast-reroute per-prefix
   metric 10
  !
 !
 interface GigabitEthernet0/0/0/3
  circuit-type level-2-only
  bfd fast-detect ipv4
  bfd fast-detect ipv6
  point-to-point
  hello-padding disable
  address-family ipv4 unicast
   fast-reroute per-prefix
   metric 10
  !
  address-family ipv6 unicast
   fast-reroute per-prefix
   metric 10
  !
 !
!
segment-routing
 global-block 16000 23999
!
end
