^C
interface Loopback0
 description XR8-LAB PE NODE-ID 8
 ipv4 address 10.70.0.8 255.255.255.255
 ipv6 address 2001:db8:570:abcd::8/128
 no shutdown
!
interface GigabitEthernet0/0/0/0
 description L009 PROVIDER XR4 -> XR2
 ipv4 address 10.70.255.16 255.255.255.254
 ipv6 address 2001:db8:1700:9::/127
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description L010 PROVIDER XR4 -> R3
 ipv4 address 10.70.255.18 255.255.255.254
 ipv6 address 2001:db8:1700:a::/127
 no shutdown
!
interface GigabitEthernet0/0/0/2
 description L017 CUSTOMER XR4 -> R7 - STUDENT SERVICE EDGE
 no shutdown
!
interface GigabitEthernet0/0/0/3
 description L018 CUSTOMER XR4 -> R7 - STUDENT SERVICE EDGE
 no shutdown
!
router isis 500-SP
 is-type level-2-only
 net 49.0001.0000.0000.0008.00
 distribute link-state
 address-family ipv4 unicast
  metric-style wide
  advertise passive-only
  mpls traffic-eng level-2-only
  mpls traffic-eng router-id Loopback0
  segment-routing mpls sr-prefer
 !
 address-family ipv6 unicast
  metric-style wide
  advertise passive-only
  single-topology
  segment-routing mpls
 !
 interface Loopback0
  passive
  address-family ipv4 unicast
   prefix-sid index 8
  !
  address-family ipv6 unicast
   prefix-sid index 608
  !
 !
 interface GigabitEthernet0/0/0/0
  circuit-type level-2-only
  bfd fast-detect ipv4
  bfd fast-detect ipv6
  point-to-point
  hello-padding disable
  address-family ipv4 unicast
   fast-reroute per-prefix
   metric 10
  !
  address-family ipv6 unicast
   fast-reroute per-prefix
   metric 10
  !
 !
 interface GigabitEthernet0/0/0/1
  circuit-type level-2-only
  bfd fast-detect ipv4
  bfd fast-detect ipv6
  point-to-point
  hello-padding disable
  address-family ipv4 unicast
   fast-reroute per-prefix
   metric 10
  !
  address-family ipv6 unicast
   fast-reroute per-prefix
   metric 10
  !
 !
!
segment-routing
 global-block 16000 23999
!
end
