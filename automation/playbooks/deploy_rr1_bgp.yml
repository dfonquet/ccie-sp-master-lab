---
- name: Deploy reviewed RR1 BGP candidate
  hosts: RR1
  gather_facts: false
  tasks:
    - ansible.builtin.assert:
        that: deploy_confirm | default(false) | bool
        fail_msg: "Use -e deploy_confirm=true after reviewing --check --diff."
    - cisco.iosxr.iosxr_config:
        content: "{{ lookup('ansible.builtin.file', '../rendered/RR1_bgp.cfg') }}"
        match: line
        replace: line
        backup: true
        comment: "Ansible deployment - RR1 BGP Route Reflector"
