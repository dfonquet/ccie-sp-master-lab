name: Validate generated lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compile Python tools
        run: python -m compileall -q tools tests

      - name: Run static validator regression tests
        run: python -m unittest discover -s tests

      - name: Regenerate topology and configurations
        run: |
          python tools/build_lab.py
          python tools/render_topology.py
          python tools/build_inter_as.py
          python tools/render_inter_as.py
          python tools/build_srv6_capability.py
          python tools/render_srv6.py

      - name: Validate SRv6 capability artifacts
        run: python tools/validate_srv6_artifacts.py

      - name: Validate documentation consistency
        run: python tools/validate_documentation.py

      - name: Check Markdown structure
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

      - name: Verify generated files are committed
        run: git diff --exit-code
