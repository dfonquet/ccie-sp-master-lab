name: Validate generated lab

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python tools
        run: python -m py_compile tools/*.py

      - name: Regenerate topology and configurations
        run: |
          python tools/build_lab.py
          python tools/render_topology.py
          python tools/build_inter_as.py
          python tools/render_inter_as.py
          python tools/build_srv6_capability.py

      - name: Validate SRv6 capability artifacts
        run: python tools/validate_srv6_artifacts.py

      - name: Verify generated files are committed
        run: git diff --exit-code
